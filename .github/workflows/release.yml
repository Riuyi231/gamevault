name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled emulators
        shell: pwsh
        continue-on-error: true
        run: ./scripts/init-emulators.ps1

      - name: Build & Publish to GitHub Release
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (electron-builder creates duplicate drafts)
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $repo = "Riuyi231/gamevault"

          function Get-TagReleases {
            gh api "repos/$repo/releases" --paginate |
              ConvertFrom-Json |
              Where-Object { $_.tag_name -eq $tag }
          }

          # electron-builder may create BOTH a draft with the full installer and an
          # orphan draft (blockmap only). Keep the draft that holds the .exe.
          $mine = @(Get-TagReleases)
          $main = $mine | Where-Object {
            @($_.assets | ForEach-Object { $_.name }) -match '\.exe$'
          } | Select-Object -First 1
          if (-not $main) { $main = $mine | Select-Object -First 1 }

          if (@($mine).Count -gt 1) {
            $mainId = $main.id
            foreach ($r in $mine) {
              if ($r.id -ne $mainId) {
                gh api -X DELETE "repos/$repo/releases/$($r.id)" | Out-Null
              }
            }
          }

          # Publish the keep release by its id (tag may match multiple releases)
          gh api -X PATCH "repos/$repo/releases/$($main.id)" -F draft=false -F make_latest=true | Out-Null

          # Sweep orphans created right after the publish step
          Start-Sleep -Seconds 3
          foreach ($r in @(Get-TagReleases)) {
            if ($r.draft) {
              gh api -X DELETE "repos/$repo/releases/$($r.id)" | Out-Null
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}